[workspace]
members = [
    "crates/panopose-core",
    "crates/panopose-cli",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arturormk/panopose-rust"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
