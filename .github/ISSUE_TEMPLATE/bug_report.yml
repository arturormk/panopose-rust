name: Bug Report
description: Report a reproducible problem in PanoPose.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the version shown in the sidebar or by `panopose --version`.
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Panorama loading/viewing
        - Alignment
        - Metadata
        - Export
        - Sky removal
        - Astronomy markers
        - Packaging/install
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, Debian 13, Fedora 42
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Add logs, screenshots, sample-image notes, or any workaround.
