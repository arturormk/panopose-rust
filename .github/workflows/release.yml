name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-desktop:
    name: Linux desktop packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build CLI sidecar
        run: |
          target_triple="$(rustc -vV | awk '/^host: / {print $2}')"
          cargo build -p panopose-cli --release
          install -Dm755 "target/release/panopose-cli" "src-tauri/binaries/panopose-cli-${target_triple}"

      - name: Build and upload Tauri packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: PanoPose ${{ github.ref_name }}
          releaseBody: See the assets below to download and install PanoPose.
          releaseDraft: true
          prerelease: false
          args: --bundles deb,rpm,appimage
